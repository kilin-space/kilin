name: Publish CLI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-cli-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      ${{ !github.event.release.draft &&
          !github.event.release.prerelease &&
          startsWith(github.event.release.tag_name, 'cli-v') }}
    runs-on: ubuntu-latest
    outputs:
      package_file: ${{ steps.package.outputs.file }}
      package_sha256: ${{ steps.package.outputs.sha256 }}
      publication_state: ${{ steps.publication.outputs.state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release source
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" = "${RELEASE_SHA}"
          git merge-base --is-ancestor "${RELEASE_SHA}" refs/remotes/origin/main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/assert-cli-release.mjs
      - run: pnpm --filter @kilin-space/cli exec playwright install --with-deps chromium
      - run: pnpm verify
      - name: Create verified package
        id: package
        run: |
          mkdir release-artifact
          npm pack ./packages/cli --ignore-scripts --pack-destination release-artifact
          mapfile -t PACKAGE_FILES < <(find release-artifact -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#PACKAGE_FILES[@]}" -eq 1
          PACKAGE_PATH="${PACKAGE_FILES[0]}"
          echo "file=${PACKAGE_PATH##*/}" >> "${GITHUB_OUTPUT}"
          echo "sha256=$(sha256sum "${PACKAGE_PATH}" | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"
      - name: Check npm publication state
        id: publication
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
        run: node scripts/check-cli-publication.mjs "release-artifact/${PACKAGE_FILE}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-package-${{ github.run_id }}
          path: release-artifact/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    if: needs.verify.outputs.publication_state == 'unpublished'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.12.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-package-${{ github.run_id }}
          path: release-artifact
      - name: Verify package digest
        env:
          PACKAGE_FILE: ${{ needs.verify.outputs.package_file }}
          PACKAGE_SHA256: ${{ needs.verify.outputs.package_sha256 }}
        run: |
          test "${PACKAGE_FILE}" = "${PACKAGE_FILE##*/}"
          test -f "release-artifact/${PACKAGE_FILE}"
          test "$(sha256sum "release-artifact/${PACKAGE_FILE}" | cut -d ' ' -f 1)" = "${PACKAGE_SHA256}"
      - name: Publish
        env:
          PACKAGE_FILE: ${{ needs.verify.outputs.package_file }}
        run: npm publish "release-artifact/${PACKAGE_FILE}" --access public --ignore-scripts
